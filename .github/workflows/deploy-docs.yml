name: Deploy docs site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/deploy-docs.yml"
      - "llms.txt"
      - "llms-full.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs Material and gen-files plugin
        run: pip install mkdocs-material mkdocs-gen-files

      - name: Build (strict) and deploy to GitHub Pages
        # gh-deploy builds into site-dir, then pushes that exact directory.
        # The gen-files hook (docs/_gen_llms.py) injects llms.txt /
        # llms-full.txt from the repo root into the build output, so both
        # land at the Pages site root.
        run: mkdocs gh-deploy --force --no-history --strict --site-dir site
